name: Crear APK
on:
  push:
  workflow_dispatch:

env:
  NOMBRE: 'Aaron Vacilon'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Escribir el proyecto
        run: |
          mkdir -p app/src/main/java/com/ejemplo/dosfotos

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'DosFotos'
          include ':app'
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.7.3' }
          android {
              namespace 'com.ejemplo.dosfotos'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ejemplo.dosfotos'
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NOMBRE_APP"
                  android:icon="@drawable/icono"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ejemplo/dosfotos/MainActivity.java << 'EOF'
          package com.ejemplo.dosfotos;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.ImageDecoder;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int TOQUES = 200;
              private final Uri[] uris = new Uri[2];
              private final Bitmap[] fotos = new Bitmap[2];
              private final ImageView[] previas = new ImageView[2];
              private Button continuar;
              private boolean mostrando = false;
              private int toques = 0;

              @Override
              protected void onCreate(Bundle estado) {
                  super.onCreate(estado);
                  WindowManager.LayoutParams p = getWindow().getAttributes();
                  p.layoutInDisplayCutoutMode =
                      WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  getWindow().setAttributes(p);
                  if (estado != null) {
                      for (int i = 0; i < 2; i++) {
                          uris[i] = estado.getParcelable("uri" + i);
                          if (uris[i] != null) fotos[i] = cargar(uris[i]);
                      }
                  }
                  pantallaElegir();
              }

              @Override
              protected void onSaveInstanceState(Bundle estado) {
                  super.onSaveInstanceState(estado);
                  for (int i = 0; i < 2; i++) estado.putParcelable("uri" + i, uris[i]);
              }

              private void pantallaElegir() {
                  mostrando = false;
                  LinearLayout caja = new LinearLayout(this);
                  caja.setOrientation(LinearLayout.VERTICAL);
                  caja.setGravity(Gravity.CENTER);
                  caja.setPadding(48, 48, 48, 48);
                  for (int i = 0; i < 2; i++) {
                      final int n = i;
                      previas[i] = new ImageView(this);
                      previas[i].setImageBitmap(fotos[i]);
                      caja.addView(previas[i], new LinearLayout.LayoutParams(-1, 0, 1));
                      Button b = new Button(this);
                      b.setText("Elegir foto " + (i + 1));
                      b.setOnClickListener(v -> {
                          Intent in = new Intent(Intent.ACTION_GET_CONTENT);
                          in.setType("image/*");
                          startActivityForResult(in, n);
                      });
                      caja.addView(b);
                  }
                  continuar = new Button(this);
                  continuar.setText("Continuar");
                  continuar.setEnabled(fotos[0] != null && fotos[1] != null);
                  continuar.setOnClickListener(v -> empezar());
                  caja.addView(continuar);
                  setContentView(caja);
              }

              @Override
              protected void onActivityResult(int n, int resultado, Intent datos) {
                  if (resultado != RESULT_OK || datos == null || datos.getData() == null) return;
                  Bitmap foto = cargar(datos.getData());
                  if (foto == null) {
                      Toast.makeText(this, "No se pudo abrir la foto", Toast.LENGTH_LONG).show();
                      return;
                  }
                  uris[n] = datos.getData();
                  fotos[n] = foto;
                  previas[n].setImageBitmap(foto);
                  continuar.setEnabled(fotos[0] != null && fotos[1] != null);
              }

              private Bitmap cargar(Uri uri) {
                  try {
                      return ImageDecoder.decodeBitmap(
                          ImageDecoder.createSource(getContentResolver(), uri),
                          (decoder, info, src) -> {
                              int lado = Math.max(info.getSize().getWidth(), info.getSize().getHeight());
                              decoder.setTargetSampleSize(Math.max(1, lado / 2000));
                          });
                  } catch (Exception e) {
                      return null;
                  }
              }

              private void empezar() {
                  mostrando = true;
                  toques = 0;
                  ImageView vista = new ImageView(this);
                  vista.setBackgroundColor(Color.BLACK);
                  vista.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  vista.setImageBitmap(fotos[0]);
                  vista.setOnClickListener(v -> {
                      toques++;
                      if (toques >= TOQUES) terminar();
                      else vista.setImageBitmap(fotos[toques % 2]);
                  });
                  setContentView(vista);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  ocultarBarras();
                  try { startLockTask(); } catch (Exception ignored) { }
              }

              private void terminar() {
                  mostrando = false;
                  try {
                      ActivityManager am = getSystemService(ActivityManager.class);
                      if (am.getLockTaskModeState() != ActivityManager.LOCK_TASK_MODE_NONE) stopLockTask();
                  } catch (Exception ignored) { }
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  pantallaElegir();
                  Toast.makeText(this, "Desbloqueado", Toast.LENGTH_SHORT).show();
              }

              private void ocultarBarras() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override
              public void onWindowFocusChanged(boolean foco) {
                  super.onWindowFocusChanged(foco);
                  if (foco && mostrando) ocultarBarras();
              }

              @Override
              public void onBackPressed() {
                  if (!mostrando) super.onBackPressed();
              }
          }
          EOF
